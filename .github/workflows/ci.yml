name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (type-check and tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: leader-egg-back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: leader-egg-back/package-lock.json
      - run: npm ci
      - name: Type-check (strict)
        run: npm run lint
      - name: Tests
        run: npm test
